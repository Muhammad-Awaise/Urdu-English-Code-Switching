# Separate from CI: pings Streamlit Community Cloud so the free app
# is less likely to hibernate after ~12h without traffic.
#
# Notes:
# - Keeps an already-awake app active; does not reliably wake a sleeping app.
# - If the app is asleep, open the URL once and click "Yes, get this app back up!"
# - Schedule is every 8 hours (UTC) so pings stay under the 12h inactivity window.
# - Do not use bare curl -L without a cookie jar: Streamlit often redirect-loops (curl 47).
#
# Before deploy: set APP_URL below (or as a GitHub Actions variable/secret) to your
# Streamlit Community Cloud URL, e.g. https://your-app-name.streamlit.app/

name: Streamlit keep-alive

on:
  schedule:
    # 00:00, 08:00, 16:00 UTC (~every 8 hours)
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Streamlit app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTP ping
        env:
          # TODO: replace with your deployed Streamlit URL after hosting
          APP_URL: "https://YOUR-APP-NAME.streamlit.app/"
          # Optional: override via repo variable STREAMLIT_APP_URL without editing this file
          # APP_URL: ${{ vars.STREAMLIT_APP_URL }}
          USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          set -euo pipefail

          # Prefer GitHub Actions variable if set (Settings → Secrets and variables → Actions → Variables)
          if [[ -n "${{ vars.STREAMLIT_APP_URL }}" ]]; then
            APP_URL="${{ vars.STREAMLIT_APP_URL }}"
          fi

          if [[ "${APP_URL}" == *"YOUR-APP-NAME"* ]]; then
            echo "::error::Update APP_URL in this workflow (or set repo variable STREAMLIT_APP_URL) to your real Streamlit Cloud URL."
            exit 1
          fi

          echo "Pinging: ${APP_URL}"
          echo "Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          BODY="$(mktemp)"
          COOKIES="$(mktemp)"
          trap 'rm -f "${BODY}" "${COOKIES}"' EXIT

          # Primary: cookie jar + limited redirects (fixes Streamlit redirect loops).
          set +e
          HTTP_CODE="$(
            curl -sS \
              -c "${COOKIES}" -b "${COOKIES}" \
              -L --max-redirs 15 \
              --connect-timeout 20 \
              --max-time 60 \
              -A "${USER_AGENT}" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -o "${BODY}" \
              -w "%{http_code}" \
              "${APP_URL}"
          )"
          CURL_EC=$?
          set -e

          if [[ "${CURL_EC}" -ne 0 ]]; then
            echo "::warning::Follow-redirects ping failed (curl exit ${CURL_EC}). Falling back to no-follow ping."

            set +e
            HTTP_CODE="$(
              curl -sS \
                --connect-timeout 20 \
                --max-time 30 \
                -A "${USER_AGENT}" \
                -o "${BODY}" \
                -w "%{http_code}" \
                "${APP_URL}"
            )"
            CURL_EC=$?
            set -e

            if [[ "${CURL_EC}" -ne 0 ]]; then
              echo "::error::Keep-alive ping failed (curl exit ${CURL_EC})"
              exit "${CURL_EC}"
            fi
          fi

          echo "HTTP status: ${HTTP_CODE}"
          BYTES="$(wc -c < "${BODY}" | tr -d ' ')"
          echo "Response bytes: ${BYTES}"

          if [[ ! "${HTTP_CODE}" =~ ^[23][0-9][0-9]$ ]]; then
            echo "::error::Unexpected HTTP status ${HTTP_CODE} from Streamlit app"
            head -c 500 "${BODY}" || true
            exit 1
          fi

          if grep -qiE "gone to sleep|get this app back up|app has gone to sleep" "${BODY}"; then
            echo "::warning::App appears to be sleeping. A ping alone usually cannot wake it."
            echo "Open ${APP_URL} in a browser and click \"Yes, get this app back up!\""
            exit 1
          fi

          echo "Keep-alive ping completed successfully."
