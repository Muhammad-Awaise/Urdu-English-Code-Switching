# Keep Streamlit Community Cloud from hibernating after ~12h without traffic.
#
# Important: curl/HTTP alone is NOT enough. Streamlit serves a static HTML
# shell for plain GETs; real activity requires a browser that runs page JS
# and opens the app WebSocket. This workflow uses Playwright/Chromium and
# will click "Yes, get this app back up!" if the app is already asleep.
#
# Schedule is every 6 hours (UTC) for margin under the ~12h sleep window
# (GitHub cron can start late when the queue is busy).
#
# Pattern matches sibling: Bilingual-Sentiment-Analysis-Tool

name: Streamlit keep-alive

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Browser keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit Streamlit app
        env:
          APP_URL: "https://urdu-english-code-switching.streamlit.app/"
          KEEPALIVE_HOLD_SECONDS: "25"
          KEEPALIVE_NAV_TIMEOUT_MS: "60000"
          KEEPALIVE_WAKE_TIMEOUT_MS: "180000"
        run: python scripts/streamlit_keepalive.py
