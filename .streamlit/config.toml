[theme]
primaryColor = "#1e4fd6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
textColor = "#071526"
font = "sans serif"

[server]
headless = true
enableCORS = false
maxUploadSize = 500

[browser]
gatherUsageStats = false

# Reduce top-right app chrome for viewers.
# "minimal" keeps only Cloud-injected / set_page_config menu items;
# if none remain, the ⋮ menu hides. Does not remove Streamlit Community
# Cloud host controls (Share / star / edit / GitHub) outside the app iframe.
[client]
toolbarMode = "minimal"
